<!-- <a> — Link -->
    <!-- Creates a link -->
     <a href="https://www.google.com">Visit Google</a>

     <!-- href — Hyperlink Reference -->
      <p>The href attribute specifies the destination URL of a link.</p>
      <a href="https://www.google.com">Google</a>
      <p>বাংলা: href বলে দেয় link-এ click করলে কোন website বা webpage-এ যেতে হবে।</p>

      <!-- target — Link Target -->

      <a href="https://www.google.com" target="_blank"> Open Google </a>
